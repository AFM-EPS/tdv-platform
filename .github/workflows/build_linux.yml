name: Compilar Space Escape (Linux)

on:
  push:
    branches: [ "main" ] # Se ejecutará automáticamente al subir código a la rama main
  workflow_dispatch: # Te permite darle al botón de "Play" manualmente en GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Usamos una versión muy estable para compilaciones

    - name: 📦 Instalar dependencias del sistema (Audio y Gráficos)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libasound2-dev

    - name: 📚 Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: 🛠️ Compilar el juego con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "SpaceEscape" --add-data "assets:assets" --collect-data arcade --copy-metadata arcade src/main.py

    - name: 🗜️ Comprimir el resultado
      run: |
        cd dist
        tar -czvf SpaceEscape-Linux.tar.gz SpaceEscape

    - name: 🚀 Subir el juego compilado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: SpaceEscape-Linux-Build
        path: dist/SpaceEscape-Linux.tar.gz
